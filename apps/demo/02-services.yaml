apiVersion: v1
kind: Service
metadata:
  name: rollout-bluegreen-active
  namespace: demo
spec:
  type: NodePort
  selector:
    app: rollout-bluegreen
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
    nodePort: 30081

