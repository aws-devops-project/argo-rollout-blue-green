apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blue-green-rollout
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aws-devops-project/argo-rollout-blue-green.git
    targetRevision: HEAD
    path: apps/demo
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true