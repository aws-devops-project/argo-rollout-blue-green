apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bluegreen-demo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aws-devops-project/argo-rollout-blue-green.git
    targetRevision: HEAD
    path: apps/demo/overlays/blue
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
