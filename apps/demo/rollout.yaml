apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  name: demo-rollout
  namespace: demo

spec:
  replicas: 2

  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: demo

  template:
    metadata:
      labels:
        app: demo

    spec:
      containers:

      - name: demo

        image: shubham808/blue-green-demo:v1

        imagePullPolicy: Always

        ports:
        - containerPort: 3000

        # env:

        # - name: ENVIRONMENT
        #   value: BLUE

        # - name: VERSION
        #   value: v1

        # - name: REGION
        #   value: eu-west-2

        # - name: POD_NAME
        #   valueFrom:
        #     fieldRef:
        #       fieldPath: metadata.name

        # - name: POD_IP
        #   valueFrom:
        #     fieldRef:
        #       fieldPath: status.podIP

        # - name: NODE_NAME
        #   valueFrom:
        #     fieldRef:
        #       fieldPath: spec.nodeName

  strategy:

    blueGreen:

      activeService: demo-active

      previewService: demo-preview

      autoPromotionEnabled: false