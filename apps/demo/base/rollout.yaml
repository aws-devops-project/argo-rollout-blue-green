apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-app
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    blueGreen:
      activeService: demo-app-active
      previewService: demo-app-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: webserver
          image: nginx:1.27-alpine
          command:
            - /bin/sh
          args:
            - -c
            - |
              cat > /usr/share/nginx/html/index.html <<'HTML'
              <!doctype html>
              <html lang="en">
              <head>
                <meta charset="utf-8">
                <meta name="viewport" content="width=device-width, initial-scale=1">
                <title>Blue Environment</title>
                <style>
                  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1167b1; color: white; font-family: Arial, sans-serif; }
                  main { text-align: center; }
                  h1 { font-size: clamp(2rem, 7vw, 5rem); margin: 0; }
                  p { font-size: 1.2rem; }
                </style>
              </head>
              <body>
                <main>
                  <h1>Welcome to BLUE Environment</h1>
                  <p>Argo Rollouts active service</p>
                </main>
              </body>
              </html>
              HTML
              nginx -g 'daemon off;'
          ports:
            - containerPort: 80
              name: http
